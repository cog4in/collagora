<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Collagora Privacy Policy</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", sans-serif;
        --ink: #1a1a1a;
        --page: #faf8f5;
        --accent: #6f5638;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f2efe9;
          --page: #161514;
          --accent: #d9b98f;
        }
      }

      body {
        margin: 0;
        padding: 40px 20px;
        color: var(--ink);
        background: var(--page);
      }

      main {
        max-width: 760px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.2;
      }

      p {
        line-height: 1.65;
      }

      a {
        color: var(--accent);
        font-weight: 600;
      }

      .links {
        display: grid;
        gap: 12px;
        margin-top: 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Collagora Privacy Policy</h1>
      <p>Select a language to view the privacy policy. / 请选择语言查看隐私政策。</p>
      <div class="links">
        <a href="./docs/privacy-policy-en">English Privacy Policy</a>
        <a href="./docs/privacy-policy-zh">简体中文隐私政策</a>
      </div>
    </main>
  </body>
</html>
